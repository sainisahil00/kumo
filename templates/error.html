{% extends "base.html" %}
{% from "_icons.html" import logo %}
{% block title %}Kumo{% endblock %}
{% block body_class %}page-auth{% endblock %}
{% block body %}
<main class="auth">
  <div class="auth-card glass">
    <a class="brand" href="{{ url_for('landing') }}">{{ logo(38) }}<span>kumo</span></a>
    <h1>{{ 'Page not found' if code == 404 else 'Something went wrong' }}</h1>
    <p class="muted">{{ message }}</p>
    <a class="btn btn-primary btn-lg btn-block" href="{{ url_for('landing') }}">Back to Kumo</a>
  </div>
</main>
{% endblock %}
